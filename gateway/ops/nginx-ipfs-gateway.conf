# Public IPFS gateway for GNS: ipfs.slopo.net, through the rpi's Cloudflare Tunnel, to the eth-node's
# Kubo gateway (192.168.10.140:8082). The gwei.domains Worker loads .gwei websites through it
# (IPFS_GATEWAYS), the post index recovers lost posts from it, and anyone can fetch posts from it by
# CID. GET/HEAD only, rate- and concurrency-limited. Installed as /etc/nginx/conf.d/ipfs-gateway.conf
# on the rpi; it moved here from test-chat.slopo.net on 2026-10-25 (SHARED-IPFS-DEPLOYMENT.md).
limit_req_zone $binary_remote_addr zone=gns_ipfs_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gns_ipfs_connections:1m;
upstream gns_ipfs_node {
    server 192.168.10.140:8082;
    keepalive 16;
}

server {
    listen 127.0.0.1:15112;
    server_name ipfs.slopo.net;
    if ($host != ipfs.slopo.net) { return 404; }
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/ipfs-gateway-error.log warn;
    # Generic, read-only IPFS/IPNS gateway. No name or CID allowlist; the Kubo administration API is
    # not exposed.
    location ~ ^/(ipfs|ipns)/ {
        limit_except GET { deny all; }
        limit_req zone=gns_ipfs_requests burst=60 nodelay;
        limit_req_status 503;
        limit_conn gns_ipfs_connections 32;
        proxy_pass http://gns_ipfs_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "192.168.10.140:8082";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_buffering off;
        proxy_hide_header Set-Cookie;
        proxy_redirect http://192.168.10.140:8082/ /;
        # Fetch transport only: arbitrary content is sandboxed on this origin. GNS supplies its own
        # policy on each name's origin.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location / { return 404; }
}
