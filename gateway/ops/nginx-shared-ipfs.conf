# Bound shared IPFS gateway work independently of the RPC route.
limit_req_zone $binary_remote_addr zone=gns_ipfs_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gns_ipfs_connections:1m;
upstream gns_ipfs_node {
    server 192.168.10.140:8082;
    keepalive 16;
}

# Only these website origins may use the RPC from a browser.
map $http_origin $chat_rpc_origin {
    default "";
    "https://ethchat.gwei.domains" $http_origin;
    ~^https://bafybeiefwzlzw6cwbu5qqxdi7ini3rol7bcdrqt4q4664reshg4ncf566a\.ipfs\.dweb\.link$ $http_origin;
}

# Reuse TLS connections to the same public RPC. No response cache.
upstream chat_plataberget_rpc {
    server rpc.plataberget.ethpandaops.io:443;
    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 127.0.0.1:15110;
    server_name test-chat.slopo.net;
    if ($host != test-chat.slopo.net) { return 404; }
    root /srv/test-chat/current;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/test-chat-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    # Browser CORS transport only: fixed public upstream, no index/cache/keys.
    location = /rpc {
        if ($request_method = OPTIONS) { return 204; }
        limit_except POST OPTIONS { deny all; }
        add_header Access-Control-Allow-Origin $chat_rpc_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;
        client_max_body_size 128k;
        client_body_buffer_size 128k;
        proxy_pass https://chat_plataberget_rpc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host rpc.plataberget.ethpandaops.io;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name rpc.plataberget.ethpandaops.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Generic, read-only IPFS/IPNS gateway. No name or CID allowlist.
    # Reuse the existing HTTPS tunnel; the Kubo administration API is not exposed.
    location ~ ^/(ipfs|ipns)/ {
        limit_except GET { deny all; }
        limit_req zone=gns_ipfs_requests burst=60 nodelay;
        limit_req_status 503;
        limit_conn gns_ipfs_connections 32;
        proxy_pass http://gns_ipfs_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "192.168.10.140:8082";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_buffering off;
        proxy_hide_header Set-Cookie;
        proxy_redirect http://192.168.10.140:8082/ /;
        # Fetch transport only: arbitrary content must not run with this host's
        # existing app origin. GNS supplies its own policy on each name's origin.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
    location /releases/ {
        root /srv/test-chat;
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ /\. { deny all; }
}
