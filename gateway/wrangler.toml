name = "gwei-gateway"
main = "index.js"
compatibility_date = "2026-08-15"
workers_dev = false

# Runs the worker for every subdomain of gwei.domains. Requires a proxied wildcard
# DNS record for *.gwei.domains (see README.md). The apex gwei.domains and the
# diff.gwei.domains service are unaffected (apex isn't matched; diff is proxied through).
routes = [
  { pattern = "*.gwei.domains/*", zone_name = "gwei.domains" },
  # The posts API (posts/SPEC.md) lives on the dapp's own origin; every other apex path stays with the dapp.
  { pattern = "gwei.domains/api/*", zone_name = "gwei.domains" },
  # gwei.limo: the same name sites under a shorter domain; its apex redirects to gwei.domains.
  # Needs proxied DNS records for both * and the apex (see README.md).
  { pattern = "*.gwei.limo/*", zone_name = "gwei.limo" },
  { pattern = "gwei.limo/*", zone_name = "gwei.limo" },
]

[[durable_objects.bindings]]
name = "RPC_BROKER"
class_name = "RpcBroker"

[exports.RpcBroker]
type = "durable-object"
storage = "sqlite"

# The index of .gwei posts, rebuilt from GnsPosts events and the blobs they name (posts-store.js).
[[durable_objects.bindings]]
name = "POST_INDEX"
class_name = "PostIndex"

[exports.PostIndex]
type = "durable-object"
storage = "sqlite"

[vars]
# The same IPFS/IPNS retrieval path applies to every GNS name and CID, and the post index recovers lost
# posts through it. ipfs.slopo.net is the eth-node's Kubo (gateway/ops/nginx-ipfs-gateway.conf). Filebase is the public gateway
# that still answers Worker traffic. ipfs.io and dweb.link are left out: they rate-limit Cloudflare's
# shared egress (429 on every request in October 2026), so they never served content and would make
# the daily health check fail every day.
IPFS_GATEWAYS = '["https://ipfs.slopo.net","https://ipfs.filebase.io"]'

# GnsPosts (src/GnsPosts.sol) and the block it was deployed in; indexing is off while unset.
POSTS_CONTRACT = '0x73849f6f2785BA7fd2f41b5B4573B75554417981'
POSTS_FROM_BLOCK = '26268082'
# Where the post indexer fetches blobs: Blobscan, which keeps them past the 18 days beacon nodes do, then beacon APIs.
BLOB_SOURCES = '{"blobscan":"https://api.blobscan.com","beacons":["https://ethereum-beacon-api.publicnode.com"]}'

# Daily endpoint health check, and the post index sync every minute (the `scheduled` handler in worker.js).
[triggers]
crons = ["17 6 * * *", "* * * * *"]

# Keep Workers Logs, so rpc_failed, resolve_stale and endpoint_health events can be read after the fact.
[observability]
enabled = true
